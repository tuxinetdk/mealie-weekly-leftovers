name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate scripts and locales
        run: |
          python3 -m py_compile patch/apply_patch.py scripts/validate-locales.py
          bash -n scripts/install.sh
          bash -n scripts/mealie-update-guard.sh
          python3 scripts/validate-locales.py

      - name: Validate patch against Mealie v3.23.1
        run: |
          curl -fsSL https://github.com/mealie-recipes/mealie/archive/refs/tags/v3.23.1.tar.gz -o /tmp/mealie.tar.gz
          tar -xzf /tmp/mealie.tar.gz -C /tmp
          python3 patch/apply_patch.py \
            --root /tmp/mealie-3.23.1 \
            --config config/default.json \
            --locales locales \
            --check
          python3 patch/apply_patch.py \
            --root /tmp/mealie-3.23.1 \
            --config config/default.json \
            --locales locales \
            --apply
