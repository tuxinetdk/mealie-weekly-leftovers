name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate scripts and locales
        run: |
          python3 -m py_compile \
            patch/apply_patch.py \
            patch/apply_patch_v323.py \
            patch/apply_patch_v324.py \
            patch/apply_patch_v329.py \
            patch/apply_patch_v330.py \
            scripts/validate-locales.py
          bash -n scripts/install.sh
          bash -n scripts/upgrade.sh
          bash -n scripts/mealie-update-guard.sh
          python3 scripts/validate-locales.py

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mealie:
          - v3.23.1
          - v3.24.0
          - v3.29.0
          - v3.30.0
    steps:
      - uses: actions/checkout@v7

      - name: Download Mealie ${{ matrix.mealie }}
        run: |
          version="${{ matrix.mealie }}"
          curl -fsSL \
            "https://github.com/mealie-recipes/mealie/archive/refs/tags/${version}.tar.gz" \
            -o /tmp/mealie.tar.gz
          tar -xzf /tmp/mealie.tar.gz -C /tmp

      - name: Validate and apply Weekly Leftovers patch
        run: |
          version="${{ matrix.mealie }}"
          root="/tmp/mealie-${version#v}"
          python3 patch/apply_patch.py \
            --root "$root" \
            --config config/default.json \
            --locales locales \
            --check
          python3 patch/apply_patch.py \
            --root "$root" \
            --config config/default.json \
            --locales locales \
            --apply

      - name: Compile patched frontend with upstream toolchain
        run: |
          version="${{ matrix.mealie }}"
          root="/tmp/mealie-${version#v}"
          DOCKER_BUILDKIT=1 docker build \
            --target frontend-builder \
            -t "mealie-rester-frontend:${version#v}" \
            -f "$root/docker/Dockerfile" \
            "$root"

      - name: Export patched v3.30.0 frontend
        if: matrix.mealie == 'v3.30.0'
        run: |
          set -euo pipefail
          cid="$(docker create mealie-rester-frontend:3.30.0)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir -p "$RUNNER_TEMP/rester7-artifact"
          docker cp "$cid:/frontend/dist" "$RUNNER_TEMP/rester7-artifact/dist"
          tar -C "$RUNNER_TEMP/rester7-artifact" \
            -czf "$RUNNER_TEMP/rester7-v3.30.0.tar.gz" dist
          test -s "$RUNNER_TEMP/rester7-v3.30.0.tar.gz"

      - name: Upload patched v3.30.0 frontend
        if: matrix.mealie == 'v3.30.0'
        uses: actions/upload-artifact@v7
        with:
          name: rester7-mealie-v3.30.0-dist
          path: ${{ runner.temp }}/rester7-v3.30.0.tar.gz
          if-no-files-found: error
          retention-days: 7
